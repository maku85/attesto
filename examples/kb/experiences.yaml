      statement: Migrated 32 services from virtual machines to Kubernetes together with two colleagues.
      metrics:
        - { value: 32, unit: services, context: services migrated }
      skills: [skl-kubernetes, skl-docker, skl-terraform]
      date: 2023-06
    - id: ach-lagonube-cloud-cost
      statement:
        it: Ho ridotto la spesa cloud mensile del 27% dimensionando correttamente i node pool.
        en: Cut monthly cloud spending by 27% by right-sizing the node pools.
        de: Monatliche Cloud-Kosten durch passend dimensionierte Node-Pools um 27% gesenkt.
      metrics:
        - { value: 27, unit: "%", context: reduction of monthly cloud spending }
      skills: [skl-kubernetes, skl-aws]
      date: 2024-03
    - id: ach-lagonube-alerting
      statement: Introduced service-level objectives and reduced pager alerts from 120 to 35 per month.
      metrics:
        - { value: 120, unit: alerts per month, context: before }
        - { value: 35, unit: alerts per month, context: after }
      skills: [skl-observability]

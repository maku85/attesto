    it: Piattaforma interna su Kubernetes usata dai team di sviluppo prodotto.
    en: Internal Kubernetes platform used by the product development teams.
    de: Interne Kubernetes-Plattform für die Produktentwicklungsteams.
  achievements:
    - id: ach-lagonube-deploy-time
      statement:
        it: Ho ridotto il tempo mediano di deploy da 45 a 8 minuti riscrivendo le pipeline CI/CD.
        en: Reduced the median deployment time from 45 to 8 minutes by rewriting the CI/CD pipelines.
        de: Mediane Deployment-Zeit durch neu geschriebene CI/CD-Pipelines von 45 auf 8 Minuten gesenkt.

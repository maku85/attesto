    - id: ach-lagonube-mentoring
      statement: Mentored 3 junior engineers.
      metrics:
        - { value: 3, unit: people, context: junior engineers mentored }
      skills: [skl-mentoring]
    - id: ach-lagonube-docs-assistant
      statement: Contributed to an internal documentation assistant based on retrieval-augmented generation.
      skills: [skl-llm, skl-python]
      date: 2025-02

